name: Macro alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: move-alerts-macro
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run macro scanner and news feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          m=0; n=0
          python macro.py || m=$?
          python news.py || n=$?
          exit $(( m || n ))
      - name: Save state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain macro_state.json news_state.json)" ]]; then
            git config user.name "move-alerts bot"
            git config user.email "actions@users.noreply.github.com"
            for f in macro_state.json news_state.json; do [[ -f $f ]] && git add "$f"; done
            git commit -m "State $(date -u +%F_%H%M)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
