name: US move alerts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | intraday | eod | pre | post"
        default: "auto"

permissions:
  contents: write

concurrency:
  group: move-alerts-equity
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scanner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode "${{ github.event.inputs.mode || 'auto' }}"
      - name: Save log
        if: always()
        run: |
          if [[ -n "$(git status --porcelain alerts_log.csv equity_state.json)" ]]; then
            git config user.name "move-alerts bot"
            git config user.email "actions@users.noreply.github.com"
            for f in alerts_log.csv equity_state.json; do [[ -f $f ]] && git add "$f"; done
            git commit -m "Equity log $(date -u +%F_%H%M)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
